<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Daily Islamic prayer times and Jummah times for Faizan-E-Madina, Hamilton, Ontario." />
  <meta name="theme-color" content="#0a0f0d" />
  <title>Prayer Times — Faizan-E-Madina</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- ===================== CINEMATIC HERO ===================== -->
  <section class="hero" id="hero" aria-label="Current time and next prayer">
    <!-- Time-of-day sky + mosque silhouette (pure CSS/SVG, no photos) -->
    <div class="sky" aria-hidden="true"></div>
    <div class="stars" aria-hidden="true"></div>
    <svg class="skyline" viewBox="0 0 1200 320" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
      <defs>
        <linearGradient id="silh" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#0b0f12" stop-opacity="0.55"/>
          <stop offset="100%" stop-color="#05070a" stop-opacity="0.92"/>
        </linearGradient>
      </defs>
      <g fill="url(#silh)">
        <!-- minaret -->
        <path d="M905 60 l8 26 6 40 v10 h-28 v-10 l6-40 z"/>
        <rect x="898" y="132" width="26" height="14" rx="2"/>
        <rect x="900" y="146" width="22" height="130"/>
        <path d="M896 146 h30 l-4 -8 h-22 z"/>
        <!-- crescent finial -->
        <path d="M911 40 a10 10 0 1 0 0 20 a8 8 0 1 1 0 -20z" opacity="0.9"/>
        <!-- main dome -->
        <path d="M1000 276 v-70 a70 70 0 0 1 140 0 v70 z"/>
        <rect x="1064" y="120" width="12" height="26" rx="2"/>
        <circle cx="1070" cy="116" r="6"/>
        <!-- small domes / rooftops -->
        <path d="M1020 276 v-30 a26 26 0 0 1 52 0 v30 z" opacity="0.9"/>
        <rect x="120" y="238" width="150" height="82"/>
        <rect x="150" y="214" width="90" height="24"/>
        <rect x="300" y="256" width="120" height="64"/>
        <path d="M700 276 v-26 a22 22 0 0 1 44 0 v26 z"/>
        <rect x="716" y="236" width="12" height="16"/>
      </g>
    </svg>

    <div class="hero-inner">
      <div class="hero-top">
        <span class="wordmark">Faizan-E-Madina</span>
        <div class="clock-wrap">
          <span class="clock" id="liveClock">--:--</span><span class="clock-sec" id="clockSec"></span>
          <span class="hijri" id="hijriDate">—</span>
        </div>
      </div>

      <div class="hero-next" id="nextPrayer" aria-live="polite">
        <span class="next-label">Next Jama'ah</span>
        <p class="next-name" id="nextName">—</p>
        <p class="next-remaining" id="nextRemaining"></p>
        <div class="next-progress" aria-hidden="true"><span id="nextProgressBar"></span></div>
      </div>

      <div class="hero-foot">
        <p class="loc-line" id="location">Hamilton, Ontario</p>
        <a class="dir-link" id="directionsBtn" href="#" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true" fill="currentColor">
            <path d="M21.7 11.3l-9-9a1 1 0 0 0-1.4 0l-9 9a1 1 0 0 0 0 1.4l9 9a1 1 0 0 0 1.4 0l9-9a1 1 0 0 0 0-1.4zM14 14.5V12h-4v3H8v-4a1 1 0 0 1 1-1h5V7.5l3.5 3.5z"/>
          </svg>
          Directions
        </a>
        <span class="greg" id="gregorianDate">—</span>
      </div>
    </div>
  </section>

  <main class="container">
    <!-- ===================== DAILY PRAYERS ===================== -->
    <section aria-label="Daily prayer times">
      <div class="row-head" aria-hidden="true">
        <span class="rh-name">Prayer</span>
        <span class="rh-col">Iqamah / Begins</span>
      </div>
      <div class="prayer-grid" id="prayerGrid"><!-- filled by JS --></div>

      <!-- Sunrise / Sunset (informational, not prayers) -->
      <div class="sun-strip" aria-label="Sunrise and sunset times">
        <div class="sun-item">
          <span class="sun-ico" aria-hidden="true">☀</span>
          <span class="sun-lbl">Sunrise</span>
          <span class="sun-time" id="sunriseTime">—</span>
        </div>
        <div class="sun-item">
          <span class="sun-ico" aria-hidden="true">☾</span>
          <span class="sun-lbl">Sunset <span class="sun-note">(Maghrib)</span></span>
          <span class="sun-time" id="sunsetTime">—</span>
        </div>
      </div>

      <p class="times-source" id="timesSource" aria-live="polite"></p>
    </section>

    <!-- ===================== JUMMAH ===================== -->
    <section class="jummah" aria-label="Jummah prayer times">
      <h2 class="section-title jummah-title">Jummah <span class="jummah-sub">Friday</span></h2>
      <div class="jummah-grid" id="jummahGrid"><!-- filled by JS --></div>
    </section>

    <!-- ===================== ANNOUNCEMENTS ===================== -->
    <section class="announcements" id="announcementsSection" aria-label="Announcements">
      <h2 class="section-title">Announcements</h2>
      <div id="announcementsList"><!-- filled by JS --></div>
    </section>
  </main>

  <!-- ===================== FOOTER ===================== -->
  <footer class="site-footer">
    <div class="container">
      <p class="footer-org">Faizan-E-Madina</p>
      <p class="footer-note">
        <a id="footerLink" href="https://www.dawateislami.net" target="_blank" rel="noopener">Visit Dawat-e-Islami →</a>
      </p>
      <p class="footer-disclaimer">This website is not managed by the Mosque management.</p>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
